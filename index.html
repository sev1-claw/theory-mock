<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Theory Mock — 50 hard questions</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1f2d3d;--accent:#e8730c;--blue:#0b5ed7;--ok:#1a8a3a;--bad:#c92a2a;--line:#e2e4e9;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  header h1{font-size:16px;margin:0;font-weight:700;}
  .prog{font-size:14px;color:#667;}
  .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .cat{color:var(--accent);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.3px;}
  .q{font-size:19px;line-height:1.35;font-weight:600;margin:8px 0 6px;}
  .hint{color:#8a94a6;font-size:13px;margin-bottom:16px;}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;font-size:16px;cursor:pointer;transition:.12s;color:var(--ink);}
  .opt:active{transform:scale(.99);}
  .opt.sel{border-color:var(--blue);background:#eef4ff;}
  .nav{display:flex;gap:10px;margin-top:8px;}
  button.act{flex:1;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;}
  .next{background:var(--accent);color:#fff;}
  .next:disabled{opacity:.4;}
  .back{background:#e7e9ee;color:#333;flex:0 0 90px;}
  /* results */
  .score{text-align:center;padding:24px 0;}
  .score .big{font-size:52px;font-weight:800;}
  .pass{color:var(--ok);} .fail{color:var(--bad);}
  .verdict{font-size:20px;font-weight:700;margin-top:4px;}
  .sub{color:#667;margin-top:6px;font-size:14px;}
  .rev{margin-top:22px;}
  .rev h2{font-size:15px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .ritem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .ritem .rq{font-weight:600;margin-bottom:8px;}
  .row{font-size:15px;margin:3px 0;}
  .row.your{color:var(--bad);}
  .row.correct{color:var(--ok);}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;}
  .tag.y{background:#ffe3e3;color:var(--bad);}
  .tag.c{background:#d3f9d8;color:var(--ok);}
  .retry{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;width:100%;margin-top:10px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🚗 UK Theory — Hard Mock</h1><span class="prog" id="prog"></span></header>
  <div class="bar"><i id="fill"></i></div>
  <div id="quiz"></div>
  <div id="result" style="display:none"></div>
</div>
<script>

 {c:"Pedestrian crossings",q:"At a pelican crossing, a flashing amber light means…",o:["Stop and wait","Give way to pedestrians still on the crossing","Speed up to clear it","Same as a red light"],a:1},

 {c:"Traffic lights",q:"A steady amber traffic light means…",o:["Go if the road is clear","Stop, unless you're so close that stopping could cause a crash","Speed up","Give way to the right"],a:1},
 {c:"Skidding",q:"Most skids are caused by…",o:["Faulty tyres","The driver braking or steering too harshly for the conditions","Poor road surface alone","Wind"],a:1},

 {c:"Tyres",q:"The minimum legal tread depth for a car tyre is…",o:["1.0 mm","1.6 mm","2.0 mm","3.0 mm"],a:1},
 {c:"Tyres",q:"Over the tread, the 1.6 mm minimum must apply…",o:["Anywhere on the tyre","Across the central 3/4 and around the whole circumference","Only on the outer edge","Only where it's worn most"],a:1},

 {c:"Environment",q:"A catalytic converter is fitted to…",o:["Increase engine power","Reduce toxic exhaust emissions","Improve the brakes","Cool the engine"],a:1},
 {c:"Parking",q:"At night you may park without lights on a road with a speed limit of…",o:["30 mph or less","40 mph","60 mph","Any speed limit"],a:0},
 {c:"Level crossings",q:"At a level crossing the amber light comes on and the alarm sounds as you approach. You should…",o:["Drive across quickly","Stop before the crossing and wait","Zig-zag around the barrier","Reverse away fast"],a:1},
 {c:"Motorway studs",q:"On a motorway, RED reflective studs mark…",o:["The left-hand edge of the carriageway","The lane centres","The right-hand edge","Slip road entrances"],a:0},
 {c:"Motorway studs",q:"AMBER reflective studs on a motorway mark…",o:["The left edge","The right-hand edge (next to the central reservation)","Lane dividers","Lay-bys"],a:1},
 {c:"Motorway studs",q:"GREEN reflective studs mark…",o:["Roadworks","The edge of the main carriageway at slip roads and lay-bys","The central reservation","Lane centres"],a:1},
 {c:"Motorway studs",q:"WHITE reflective studs are found…",o:["Between the lanes","At the far right edge","At slip roads only","At the hard shoulder edge"],a:0},
 {c:"Motorways",q:"You miss your exit on the motorway. You should…",o:["Reverse back to it","Stop and turn around","Carry on to the next exit","Cross the central reservation"],a:2},
 {c:"Motorways",q:"Your car breaks down on a motorway with a hard shoulder. After stopping you should…",o:["Stay in the car with a seatbelt on","Leave by the left doors and wait behind the barrier up the bank","Stand in front of the car","Open the bonnet and stand beside it"],a:1},
 {c:"Smart motorways",q:"On a motorway with no hard shoulder, in a breakdown you should aim to reach…",o:["The central reservation","An emergency refuge area","The nearest bridge","A slip road only"],a:1},
 {c:"Tunnels",q:"Before entering a long tunnel you should…",o:["Put on sunglasses","Remove sunglasses and tune the radio to any traffic channel","Turn off your lights","Close all air vents"],a:1},
 {c:"Weather",q:"In gusty crosswinds, which are most likely to be blown off course?",o:["Heavy lorries","Cyclists and high-sided vehicles","Sports cars","Buses only"],a:1},
 {c:"Weather",q:"You are driving in fog below 100 m visibility. You should use…",o:["Full-beam headlights","Dipped headlights and fog lights","Sidelights only","Hazard lights while moving"],a:1},
 {c:"Weather",q:"To move off on packed snow or ice, you should…",o:["Use maximum revs","Pull away gently in as high a gear as possible","Spin the wheels to get grip","Use the handbrake to help"],a:1},
 {c:"Night driving",q:"You are dazzled by the headlights of an oncoming vehicle. You should…",o:["Flash back at them","Slow down or stop until you can see clearly","Speed up to pass quickly","Close your eyes briefly"],a:1},
 {c:"Junctions",q:"You must NOT enter a yellow box junction unless…",o:["The lights are green","Your exit road is clear","There is no camera","A police officer waves you on"],a:1},
 {c:"Junctions",q:"(Exception) You MAY wait in a box junction when…",o:["Turning left","Going straight on","Turning right and only oncoming traffic stops you","Never"],a:2},
 {c:"Roundabouts",q:"At a mini-roundabout you should give way to…",o:["Traffic on your left","Traffic already on the roundabout / from the right","The largest vehicle","Nobody — just go"],a:1},
 {c:"Crossings",q:"A toucan crossing is designed to be used by…",o:["Pedestrians only","Pedestrians and cyclists together","Horse riders","Buses"],a:1},
 {c:"Crossings",q:"A puffin crossing differs from a pelican because it…",o:["Has a flashing amber phase","Uses sensors and has no flashing amber phase","Is only for cyclists","Has no red light"],a:1},
 {c:"Crossings",q:"At a zebra crossing you must give way once a pedestrian…",o:["Is waiting on the pavement","Has stepped onto the crossing","Has fully crossed","Presses a button"],a:1},
 {c:"Road markings",q:"Double white lines with a solid line on your side mean you…",o:["May cross to overtake","Must not cross or straddle it (except in limited cases)","May park there","Must stop"],a:1},
 {c:"Road markings",q:"A single yellow line along the kerb means…",o:["No stopping at any time","Waiting restrictions apply at certain times (check the sign)","Loading only","Bus lane"],a:1},
 {c:"Road markings",q:"Double red lines (a red route) mean…",o:["Bus lane only","No stopping at any time","Parking with a permit","Waiting for 30 minutes"],a:1},
 {c:"Emergency vehicles",q:"An ambulance with flashing blue lights is behind you. You should…",o:["Brake hard immediately","Pull over safely when you can, without breaking the law","Speed up to clear the road","Stop instantly wherever you are"],a:1},
 {c:"Trams",q:"When sharing the road with trams you should remember they…",o:["Can stop very quickly","Cannot steer to avoid you and have priority","Always give way to cars","Only run at night"],a:1},
 {c:"Vulnerable users",q:"Before pulling away, a motorcyclist glances over their shoulder. This is called a…",o:["Blind check","Life-saver glance","Mirror signal","Head bob"],a:1},
 {c:"Buses",q:"A bus ahead is signalling to move out from a bus stop. You should…",o:["Accelerate past it","Give way to it if it's safe to do so","Sound your horn","Overtake on the left"],a:1},
 {c:"Child safety",q:"Who is responsible for making sure children under 14 wear seat belts or restraints?",o:["The children","The front passenger","The driver","Nobody — it's advisory"],a:2},
 {c:"Child safety",q:"A child must normally use a child car seat until they are…",o:["12 years old or 135 cm tall (whichever first)","10 years old","7 years old","5 years old"],a:0},
 {c:"Alcohol & drugs",q:"You drank heavily last night. The next morning you may…",o:["Definitely be fine to drive","Still be over the legal limit","Drive if you feel okay","Drive after a coffee"],a:1},
 {c:"Alcohol & drugs",q:"Prescription medicine warns it may cause drowsiness. You should…",o:["Take a smaller dose and drive","Not drive and check with a doctor/pharmacist","Drive with the window open","Drive only short distances"],a:1},
 {c:"Fatigue",q:"Tiredness is most likely to affect you when driving on…",o:["Busy city streets","Long, monotonous roads like motorways","Country lanes","Roundabouts"],a:1},
 {c:"Vehicle checks",q:"Your brakes feel spongy when pressed. This could mean…",o:["The tyres are new","Air or a fault in the brake fluid system","The battery is flat","The lights are on"],a:1},
 {c:"Vehicle checks",q:"Your car pulls to one side when braking. The likely cause is…",o:["Cold weather","Uneven tyre pressures or a brake fault","A full fuel tank","Worn wipers"],a:1},
 {c:"Vehicle checks",q:"When should you increase your tyre pressures?",o:["Never","When carrying a heavy load or driving fast for a long way","In cold weather only","When the tyres are new"],a:1},
 {c:"Environment",q:"Leaving a roof box or roof rack on when not needed will…",o:["Improve grip","Increase drag and fuel consumption","Lower emissions","Make the car faster"],a:1},
 {c:"Environment",q:"A spilt patch of diesel on the road is dangerous because it…",o:["Damages tyres instantly","Makes the surface very slippery, especially for motorcyclists","Smells bad","Blocks drains"],a:1},
 {c:"Documents",q:"If asked by police and you don't have your documents with you, you must produce them within…",o:["24 hours","3 days","7 days","1 month"],a:2},
 {c:"Speed limits",q:"In a 20 mph zone with traffic-calming (humps), you should…",o:["Speed up between humps","Keep to a steady speed within the limit","Ignore the limit if clear","Only slow at the humps"],a:1},
 {c:"Overtaking",q:"You should NOT overtake when…",o:["The road ahead is clear","You are approaching a bend, junction or the brow of a hill","On a dual carriageway","There is a dashed centre line"],a:1},
 {c:"Signals",q:"You intend to turn right at a junction. You should signal…",o:["As you start to turn","In good time before the junction","Only if others are around","After you've turned"],a:1},
 {c:"Observation",q:"Before moving off from the kerb, your final check should be…",o:["The rear-view mirror only","A blind-spot (shoulder) check","The fuel gauge","The handbrake"],a:1},

 {c:"Motorways",q:"The minimum age to ride a moped is 16, but you may drive on a motorway only if the vehicle can exceed…",o:["30 mph","50 mph","No minimum","70 mph"],a:1},
 {c:"Loads",q:"A load projecting more than 1 metre behind your vehicle requires…",o:["Nothing","A clearly visible marker","A police escort always","Hazard lights only"],a:1},
 {c:"Braking",q:"On a long downhill, to help control your speed you should…",o:["Coast in neutral","Select a lower gear to use engine braking","Ride the brakes continuously","Turn off the engine"],a:1},

 {c:"Signs",q:"An octagonal (8-sided) sign always means…",o:["Give way","Stop","No entry","National speed limit"],a:1},
 {c:"Signs",q:"A red circle with a white horizontal bar means…",o:["No entry for vehicular traffic","No overtaking","No parking","End of restriction"],a:0},
 {c:"Motorways",q:"You may use the right-hand lane of a three-lane motorway to…",o:["Cruise at any time","Overtake, then move back left","Drive slowly","Rest"],a:1},
 {c:"Fatigue",q:"After stopping for a rest because you feel tired, the most effective quick boost is…",o:["A cold drink","Two cups of coffee (caffeine) and a short nap","A big meal","Loud music"],a:1},
 {c:"Environment",q:"Harsh, aggressive driving compared with smooth driving typically…",o:["Uses less fuel","Uses much more fuel and increases wear","Has no effect","Is safer"],a:1}
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const TEST_SIZE=Math.min(50,BANK.length);
let Q=[];
function buildTest(){
  Q=shuffle(BANK.slice()).slice(0,TEST_SIZE).map(it=>{
    const correct=it.o[it.a];
    const opts=shuffle(it.o.slice());
    return {c:it.c,q:it.q,o:opts,a:opts.indexOf(correct)};
  });
}
buildTest();

let cur=0;
let answers=new Array(Q.length).fill(null);
const quiz=document.getElementById('quiz');
const prog=document.getElementById('prog');
const fill=document.getElementById('fill');

function render(){
  const item=Q[cur];
  prog.textContent=(cur+1)+" / "+Q.length;
  fill.style.width=((cur)/Q.length*100)+"%";
  let html='<div class="cat">'+item.c+'</div>';
  html+='<div class="q">'+item.q+'</div>';
  html+='<div class="hint">Select ONE answer</div>';
  item.o.forEach((op,i)=>{
    const sel=answers[cur]===i?' sel':'';
    html+='<button class="opt'+sel+'" onclick="pick('+i+')">'+op+'</button>';
  });
  html+='<div class="nav">';
  if(cur>0) html+='<button class="act back" onclick="go(-1)">Back</button>';
  const last=cur===Q.length-1;
  html+='<button class="act next" id="nx" onclick="next()"'+(answers[cur]===null?' disabled':'')+'>'+(last?'Finish ✓':'Next →')+'</button>';
  html+='</div>';
  quiz.innerHTML=html;
}
function pick(i){answers[cur]=i;render();}
function go(d){cur+=d;render();}
function next(){
  if(answers[cur]===null) return;
  if(cur<Q.length-1){cur++;render();}
  else finish();
}
function finish(){
  let score=0;
  Q.forEach((it,i)=>{if(answers[i]===it.a)score++;});
  const pct=Math.round(score/Q.length*100);
  const passMark=Math.round(Q.length*43/50); // real test is 43/50 (86%)
  const passed=score>=passMark;
  quiz.style.display='none';
  fill.style.width='100%';
  const res=document.getElementById('result');
  res.style.display='block';
  let h='<div class="score">';
  h+='<div class="big '+(passed?'pass':'fail')+'">'+score+'/'+Q.length+'</div>';
  h+='<div class="verdict '+(passed?'pass':'fail')+'">'+(passed?'PASS ✅':'Not yet — keep going 💪')+'</div>';
  h+='<div class="sub">'+pct+'% correct · pass mark is '+passMark+'/'+Q.length+' (86%)</div>';
  h+='</div>';
  // review wrong ones
  const wrong=Q.map((it,i)=>({it,i})).filter(x=>answers[x.i]!==x.it.a);
  if(wrong.length){
    h+='<div class="rev"><h2>Review your '+wrong.length+' mistake'+(wrong.length>1?'s':'')+'</h2>';
    wrong.forEach(x=>{
      const yo=answers[x.i]===null?'— (skipped)':x.it.o[answers[x.i]];
      h+='<div class="ritem"><div class="rq">'+(x.i+1)+'. '+x.it.q+'</div>';
      h+='<div class="row your"><span class="tag y">YOU</span>'+yo+'</div>';
      h+='<div class="row correct"><span class="tag c">RIGHT</span>'+x.it.o[x.it.a]+'</div>';
      h+='</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="rev"><h2>Perfect — no mistakes! 🎉</h2></div>';
  }
  h+='<button class="retry" onclick="newTest()">New test — fresh questions ↻</button>';
  res.innerHTML=h;
  window.scrollTo(0,0);
}
function newTest(){
  buildTest();
  cur=0;
  answers=new Array(Q.length).fill(null);
  document.getElementById('result').style.display='none';
  document.getElementById('result').innerHTML='';
  quiz.style.display='block';
  render();
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
